# ---------------------------------------------------------------------------
# Decap CMS configuration for the Red Hot Cod website.
#
# BEFORE THIS WORKS YOU MUST:
#   1. Push this whole site to a GitHub repository.
#   2. Connect that repository to Netlify (Site configuration > Build & deploy
#      > Link repository), replacing the current manual/drag-and-drop deploy.
# ---------------------------------------------------------------------------

backend:
  name: git-gateway
  repo: todd-ds/redhotcod
  branch: main
  identity_url: https://auth.decapbridge.com/sites/fd719729-f7a0-43ff-8c13-1b3bc1abc78b
  gateway_url: https://gateway.decapbridge.com

commit_messages:
  create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
  deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://redhotcod.netlify.app

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Website Content"
    files:
      - name: "contact"
        label: "Contact, Hours & Links"
        file: "content/contact.json"
        fields:
          - { label: "Address", name: "address", widget: "string" }
          - { label: "Hours (shown in the top bar)", name: "hours", widget: "string" }
          - { label: "Surcharge note", name: "surcharge_note", widget: "string" }
          - { label: "Phone (display text)", name: "phone_display", widget: "string" }
          - { label: "Phone (tel: link, e.g. tel:0756070084)", name: "phone_href", widget: "string" }
          - { label: "Instagram URL", name: "instagram_url", widget: "string" }
          - { label: "Instagram handle (e.g. @redhotcodburleigh)", name: "instagram_handle", widget: "string" }
          - { label: "Facebook URL", name: "facebook_url", widget: "string" }
          - { label: "Online ordering URL", name: "order_url", widget: "string" }

      - name: "hero"
        label: "Homepage Hero Slider"
        file: "content/hero.json"
        fields:
          - name: "slides"
            label: "Slides"
            widget: "list"
            summary: "{{fields.eyebrow}}"
            fields:
              - { label: "Theme colour", name: "theme", widget: "select", options: ["ph-chili", "ph-teal", "ph-gold", "ph-ink"] }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo alt text (for accessibility)", name: "alt", widget: "string" }
              - { label: "Small label above the heading", name: "eyebrow", widget: "string" }
              - { label: "Badge text (leave blank for none, e.g. New)", name: "badge", widget: "string", required: false }
              - { label: "Headline", name: "title", widget: "text", hint: "Use a line break for a two-line headline" }
              - { label: "Description", name: "body", widget: "text" }
              - { label: "Button text", name: "cta_text", widget: "string" }
              - { label: "Button link", name: "cta_href", widget: "string" }

      - name: "venues"
        label: "Three Venue Cards"
        file: "content/venues.json"
        fields:
          - name: "venues"
            label: "Venues"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Section ID (used for menu links, don't change lightly)", name: "id", widget: "string" }
              - { label: "Theme colour", name: "theme", widget: "select", options: ["ph-chili", "ph-teal", "ph-gold", "ph-ink"] }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo alt text", name: "alt", widget: "string" }
              - { label: "Caption on the photo", name: "caption", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Badge text (leave blank for none)", name: "badge", widget: "string", required: false }
              - { label: "Description", name: "body", widget: "text" }
              - { label: "Link text", name: "link_text", widget: "string" }
              - { label: "Link target", name: "link_href", widget: "string" }

      - name: "about"
        label: "Our Story Section"
        file: "content/about.json"
        fields:
          - { label: "Small label", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "title", widget: "string" }
          - { label: "Body text", name: "body", widget: "text" }
          - { label: "Checklist points", name: "checklist", widget: "list" }
          - { label: "Photo", name: "image", widget: "image" }
          - { label: "Photo alt text", name: "alt", widget: "string" }
          - { label: "Caption on the photo", name: "image_caption", widget: "string" }

      - name: "menu"
        label: "Menu Section"
        file: "content/menu.json"
        fields:
          - { label: "Small label", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "title", widget: "string" }
          - name: "items"
            label: "Menu Items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Dish name", name: "title", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }
          - { label: "Note under the menu grid", name: "note", widget: "text" }
          - { label: "Button text", name: "cta_text", widget: "string" }

      - name: "gallery"
        label: "Instagram-style Gallery"
        file: "content/gallery.json"
        fields:
          - { label: "Intro line", name: "intro", widget: "text" }
          - name: "items"
            label: "Photos"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Theme colour (fallback if photo is slow to load)", name: "theme", widget: "select", options: ["ph-chili", "ph-teal", "ph-gold", "ph-ink"] }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo alt text", name: "alt", widget: "string" }
              - { label: "Caption", name: "caption", widget: "string" }

      - name: "navigation"
        label: "Navigation Menu"
        file: "content/navigation.json"
        description: "Controls the menu links shown at the top of every page and in the footer. Creating a new Page does not add it here automatically: create the page first, then add or reorder its link below once it exists."
        fields:
          - name: "items"
            label: "Menu Items"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "Drag items to reorder them. This same list powers the top menu and the footer 'Explore' links."
            fields:
              - { label: "Label (shown in the menu)", name: "label", widget: "string" }
              - { label: "Link", name: "url", widget: "string", hint: "e.g. takeaway.html, cod-bar.html, index.html#about (a section of the homepage), or a full external URL (https://...) where appropriate." }
              - { label: "Show in navigation", name: "visible", widget: "boolean", default: true }

      - name: "page_takeaway"
        label: "Page: Takeaway"
        file: "content/page-takeaway.json"
        fields:
          - { label: "Small label", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "title", widget: "string" }
          - { label: "Banner photo", name: "hero_image", widget: "image" }
          - { label: "Banner photo alt text", name: "hero_alt", widget: "string" }
          - name: "body"
            label: "Body Paragraphs"
            widget: "list"
          - name: "highlights"
            label: "Menu Highlights"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Dish name", name: "title", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }
          - name: "gallery"
            label: "Photos"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Theme colour", name: "theme", widget: "select", options: ["ph-chili", "ph-teal", "ph-gold", "ph-ink"] }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo alt text", name: "alt", widget: "string" }
              - { label: "Caption", name: "caption", widget: "string" }
          - { label: "Button text", name: "cta_text", widget: "string", hint: "This button links to your online ordering URL, set on the Contact page." }

      - name: "page_cod_bar"
        label: "Page: The Cod Bar"
        file: "content/page-cod-bar.json"
        fields:
          - { label: "Small label", name: "eyebrow", widget: "string" }
          - { label: "Badge text (leave blank for none)", name: "badge", widget: "string", required: false }
          - { label: "Heading", name: "title", widget: "string" }
          - { label: "Banner photo", name: "hero_image", widget: "image" }
          - { label: "Banner photo alt text", name: "hero_alt", widget: "string" }
          - name: "body"
            label: "Body Paragraphs"
            widget: "list"
          - name: "highlights"
            label: "What To Expect"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }
          - { label: "Note (e.g. opening hours TBA)", name: "note", widget: "text" }
          - name: "gallery"
            label: "Photos"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Theme colour", name: "theme", widget: "select", options: ["ph-chili", "ph-teal", "ph-gold", "ph-ink"] }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo alt text", name: "alt", widget: "string" }
              - { label: "Caption", name: "caption", widget: "string" }
          - { label: "Button text", name: "cta_text", widget: "string", hint: "This button links to your Instagram URL, set on the Contact page." }

      - name: "page_restaurant"
        label: "Page: The Restaurant"
        file: "content/page-restaurant.json"
        fields:
          - { label: "Small label", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "title", widget: "string" }
          - { label: "Banner photo", name: "hero_image", widget: "image" }
          - { label: "Banner photo alt text", name: "hero_alt", widget: "string" }
          - name: "body"
            label: "Body Paragraphs"
            widget: "list"
          - name: "highlights"
            label: "Menu Highlights"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Dish name", name: "title", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }
          - name: "gallery"
            label: "Photos"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Theme colour", name: "theme", widget: "select", options: ["ph-chili", "ph-teal", "ph-gold", "ph-ink"] }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo alt text", name: "alt", widget: "string" }
              - { label: "Caption", name: "caption", widget: "string" }
          - { label: "Button text", name: "cta_text", widget: "string", hint: "This button links to your phone number, set on the Contact page." }

      - name: "page_menu"
        label: "Page: Full Menu"
        file: "content/page-menu.json"
        fields:
          - { label: "Small label", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "title", widget: "string" }
          - { label: "Intro paragraph", name: "intro", widget: "text" }
          - { label: "Note under the menu (pricing/surcharges)", name: "note", widget: "text" }
          - { label: "Button text", name: "cta_text", widget: "string", hint: "This button links to your online ordering URL, set on the Contact page." }
          - name: "categories"
            label: "Menu Categories"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Category name", name: "name", widget: "string" }
              - name: "items"
                label: "Dishes"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Dish name", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }

  # Generic pages the client can create freely. Each entry here becomes its
  # own HTML page, generated at build time by scripts/build-pages.js, at
  # yoursite.com/<page-name>.html. Unlike the "content" collection above,
  # this is a folder collection: the client clicks "New Page" and gets a
  # blank page rather than editing a fixed, pre-declared list of files.
  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    description: "Create a new page. It will be generated automatically and published at its own web address."
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Meta description", name: "meta_description", widget: "text", hint: "Shown in Google search results. Keep it short and descriptive." }
      - { label: "Banner photo", name: "hero_image", widget: "image", required: false }
      - { label: "Banner photo alt text", name: "hero_alt", widget: "string", required: false }
      - name: "body"
        label: "Body Paragraphs"
        widget: "list"
        hint: "Add one item per paragraph."
      - { label: "Button text (optional)", name: "cta_text", widget: "string", required: false }
      - { label: "Button link (optional)", name: "cta_href", widget: "string", required: false }
